name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            cargo_build_target: aarch64-apple-darwin
          - target: linux-amd64
            os: ubuntu-latest
            cargo_build_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.cargo_build_target }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: r7kamura/rust-problem-matchers@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cargo_build_target }}
      - name: Install ARM64 cross-compilation toolchain
        if: matrix.cargo_build_target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Clean build directory
        run: cargo clean --target ${{ matrix.cargo_build_target }}
      - name: Build
        shell: bash
        run: scripts/build_dist.sh ci-run

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: macOS-latest
            bins: --bins
    runs-on: ${{ matrix.os }}
    # Token needed for the integration tests using the gh command line
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: r7kamura/rust-problem-matchers@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test ${{ matrix.bins }}

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r7kamura/rust-problem-matchers@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run Format
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all --all-features -- -D warnings
