[package]
name = "gh-news"
version = "0.18.0"
edition = "2021"
authors = ["Chmouel Boudjnah <chmouel@chmouel.com>"]
description = "Terminal UI for GitHub notifications with filtering, preview, and auto-refresh"
license = "Apache-2.0"
repository = "https://github.com/chmouel/gh-news"
homepage = "https://github.com/chmouel/gh-news"
documentation = "https://docs.rs/gh-news"
keywords = ["github", "notifications", "tui", "cli", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.27", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "blocking",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
webbrowser = "0.8"
dirs = "5"
anyhow = "1"
thiserror = "1"
syntect = "5"
comrak = "0.18"
once_cell = "1"
parking_lot = "0.12"
url = "2.5"
base64 = "0.22"
emojis = "0.9.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
