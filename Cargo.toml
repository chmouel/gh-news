[package]
name = "gh-news"
version = "0.3.1"
edition = "2021"
authors = ["Chmouel Boudjnah <chmouel@chmouel.com>"]
description = "GitHub notifications TUI built with Rust and ratatui"
license = "Apache-2.0"

[dependencies]
ratatui = "0.27"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "blocking",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
webbrowser = "0.8"
dirs = "5"
anyhow = "1"
thiserror = "1"
syntect = "5"
comrak = "0.18"
once_cell = "1"
parking_lot = "0.12"
url = "2.5"
